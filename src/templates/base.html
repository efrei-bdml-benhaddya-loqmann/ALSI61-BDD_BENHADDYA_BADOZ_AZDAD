<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Réservation de congés{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --efrei-primary: #002855;
      --efrei-accent:  #E87722;
      --bg-app:        #F4F6F9;
      --bg-card:       #FFFFFF;
      --bg-muted:      #E6EEF7;
      --text-primary:  #0A192F;
      --text-secondary:#64748B;
      --border:        #E2E8F0;
    }

    body {
      font-family: 'Roboto', 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
    }

    /* ── Topbar ── */
    .navbar-efrei { background-color: var(--efrei-primary) !important; }

    .navbar-efrei .navbar-brand {
      color: #fff !important;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    .navbar-efrei .nav-link {
      color: rgba(255,255,255,.75) !important;
      font-weight: 500;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color .15s;
    }
    .navbar-efrei .nav-link:hover { color: #fff !important; }
    .navbar-efrei .nav-link.active-page {
      color: #fff !important;
      border-bottom: 2px solid var(--efrei-accent);
      padding-bottom: 0;
    }

    .badge-student {
      background-color: var(--efrei-accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .navbar-efrei .form-select {
      border-radius: 4px;
      font-size: 0.85rem;
      border: none;
    }

    /* ── Buttons ── */
    .btn-primary {
      background-color: var(--efrei-primary) !important;
      border-color:     var(--efrei-primary) !important;
      color: #fff !important;
    }
    .btn-primary:hover {
      background-color: #001a3a !important;
      border-color:     #001a3a !important;
    }

    .btn-outline-primary {
      color:        var(--efrei-primary) !important;
      border-color: var(--efrei-primary) !important;
    }
    .btn-outline-primary:hover {
      background-color: var(--efrei-primary) !important;
      color: #fff !important;
    }

    .btn-outline-secondary {
      color:        var(--efrei-primary) !important;
      border-color: var(--border) !important;
      background-color: var(--bg-muted) !important;
    }
    .btn-outline-secondary:hover {
      background-color: var(--efrei-primary) !important;
      border-color:     var(--efrei-primary) !important;
      color: #fff !important;
    }

    /* Filter tag buttons (mes_conges) */
    .btn-tag {
      background-color: var(--bg-muted);
      color: var(--efrei-primary);
      border: none;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 5px 14px;
      text-decoration: none;
      transition: background-color .15s, color .15s;
    }
    .btn-tag:hover { background-color: #cddaee; color: var(--efrei-primary); }
    .btn-tag.active {
      background-color: var(--efrei-primary);
      color: #fff;
    }

    /* ── Cards ── */
    .card {
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,.05);
      background-color: var(--bg-card);
    }
    .card-header {
      background-color: var(--bg-card) !important;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: var(--text-primary);
      border-radius: 12px 12px 0 0 !important;
    }

    /* ── Tables ── */
    .table { border-color: var(--border); }
    .table-light th, thead.table-light th {
      background-color: var(--bg-muted) !important;
      color: var(--text-primary);
      font-weight: 700;
      border-color: var(--border);
    }
    .table-hover tbody tr:hover { background-color: rgba(0,40,85,.035) !important; }
    .table.bg-white { border-radius: 12px; overflow: hidden; }

    /* ── Typography ── */
    h1, h2, h3, h4 { color: var(--text-primary); font-weight: 700; }
    .text-muted { color: var(--text-secondary) !important; }

    /* ── Form focus ── */
    .form-control:focus, .form-select:focus {
      border-color: var(--efrei-primary);
      box-shadow: 0 0 0 0.2rem rgba(0,40,85,.15);
    }

    /* ── Solde number ── */
    .solde-value {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--efrei-primary);
      line-height: 1;
    }

    /* ── Bootstrap color overrides ── */
    .bg-primary  { background-color: var(--efrei-primary) !important; }
    .text-primary { color: var(--efrei-primary) !important; }
    .border-primary { border-color: var(--efrei-primary) !important; }
    .badge.bg-primary { background-color: var(--efrei-primary) !important; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-efrei">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('mes_conges') }}">MyEfrei Congés</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'mes_conges' %}active-page{% endif %}" href="{{ url_for('mes_conges') }}">Mes demandes</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'conge_reserver' %}active-page{% endif %}" href="{{ url_for('conge_reserver') }}">Réserver</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'calendrier' %}active-page{% endif %}" href="{{ url_for('calendrier') }}">Calendrier équipe</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'stats' %}active-page{% endif %}" href="{{ url_for('stats') }}">Statistiques</a></li>
        </ul>

        <form class="d-flex align-items-center gap-2" method="post" action="{{ url_for('changer_utilisateur') }}">
          <span class="badge-student">Employé</span>
          <select name="id_employe" class="form-select form-select-sm" style="width:auto"
                  onchange="this.form.submit()">
            {% for emp in tous_employes %}
              <option value="{{ emp.id_employe }}"
                {% if current_user and current_user.id_employe == emp.id_employe %}selected{% endif %}>
                {{ emp.prenom }} {{ emp.nom }}
              </option>
            {% endfor %}
          </select>
        </form>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
